name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Ruff
        working-directory: backend
        run: python -m ruff check . --select E4,E7,E9,F --ignore E741,E712,F841,E402,F401,F811
      - name: Tests
        working-directory: backend
        run: python -m pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install and Lint
        working-directory: frontend
        run: |
          npm ci
          npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build
